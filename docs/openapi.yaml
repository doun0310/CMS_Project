openapi: 3.0.3
info:
  title: CMS Printer Application API
  version: 0.1.0
  description: Approval-based printer application for internal CMS
servers:
  - url: /api/v1
paths:
  /print-requests:
    get:
      summary: List print requests
      responses:
        '200':
          description: OK
    post:
      summary: Create print request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrintRequest'
      responses:
        '201':
          description: Created
  /print-requests/{id}:
    get:
      summary: Get print request detail
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
  /print-requests/{id}/reprint:
    post:
      summary: Create reprint request
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprintRequest'
      responses:
        '201':
          description: Created
  /approvals/pending:
    get:
      summary: List pending approvals
      responses:
        '200':
          description: OK
  /approvals/{printRequestId}/approve:
    post:
      summary: Approve print request
      parameters:
        - name: printRequestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
      responses:
        '200':
          description: OK
  /approvals/{printRequestId}/reject:
    post:
      summary: Reject print request
      parameters:
        - name: printRequestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: OK
  /print-jobs/{printRequestId}/dispatch:
    post:
      summary: Dispatch approved request to print queue
      parameters:
        - name: printRequestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Created
  /print-jobs/{jobId}:
    get:
      summary: Get print job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /print-jobs/{jobId}/retry:
    post:
      summary: Retry failed print job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: OK
  /agent/jobs/poll:
    post:
      summary: Poll queued jobs for agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPollRequest'
      responses:
        '200':
          description: OK
  /agent/jobs/{jobId}/status:
    post:
      summary: Update print job status from agent
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentStatusRequest'
      responses:
        '200':
          description: OK
  /printers:
    get:
      summary: List printers
      responses:
        '200':
          description: OK
    post:
      summary: Create printer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrinter'
      responses:
        '201':
          description: Created
  /printers/{id}:
    patch:
      summary: Update printer
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePrinter'
      responses:
        '200':
          description: OK
  /approval-policies:
    get:
      summary: List approval policies
      responses:
        '200':
          description: OK
    post:
      summary: Create approval policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePolicy'
      responses:
        '201':
          description: Created
  /approval-policies/{id}:
    patch:
      summary: Update approval policy
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePolicy'
      responses:
        '200':
          description: OK
  /templates:
    get:
      summary: List templates
      responses:
        '200':
          description: OK
    post:
      summary: Create template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplate'
      responses:
        '201':
          description: Created
  /templates/{id}:
    patch:
      summary: Update template
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTemplate'
      responses:
        '200':
          description: OK
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    CreatePrintRequest:
      type: object
      required:
        - documentType
        - sourceDocumentId
        - templateId
        - copies
      properties:
        documentType:
          type: string
        sourceDocumentId:
          type: string
        templateId:
          type: integer
        printerId:
          type: integer
        copies:
          type: integer
        isSensitive:
          type: boolean
        isUrgent:
          type: boolean
        requestReason:
          type: string
    ReprintRequest:
      type: object
      required:
        - copies
        - reprintReason
      properties:
        printerId:
          type: integer
        copies:
          type: integer
        reprintReason:
          type: string
    AgentPollRequest:
      type: object
      required:
        - agentKey
        - printerIds
      properties:
        agentKey:
          type: string
        printerIds:
          type: array
          items:
            type: integer
    AgentStatusRequest:
      type: object
      required:
        - agentKey
        - jobStatus
      properties:
        agentKey:
          type: string
        jobStatus:
          type: string
          enum: [PRINTING, SUCCESS, FAILED]
        failureReason:
          type: string
          nullable: true
    CreatePrinter:
      type: object
      required:
        - code
        - name
        - printerType
        - connectionType
      properties:
        code:
          type: string
        name:
          type: string
        printerType:
          type: string
        connectionType:
          type: string
        ipAddress:
          type: string
        agentKey:
          type: string
        organizationId:
          type: integer
        location:
          type: string
        status:
          type: string
    UpdatePrinter:
      type: object
      properties:
        name:
          type: string
        printerType:
          type: string
        connectionType:
          type: string
        ipAddress:
          type: string
        agentKey:
          type: string
        organizationId:
          type: integer
        location:
          type: string
        status:
          type: string
    CreatePolicy:
      type: object
      required:
        - documentType
        - minCopies
        - organizationId
      properties:
        documentType:
          type: string
        minCopies:
          type: integer
        requiresReprintApproval:
          type: boolean
        requiresManagerApproval:
          type: boolean
        requiresSensitiveApproval:
          type: boolean
        organizationId:
          type: integer
        status:
          type: string
    UpdatePolicy:
      type: object
      properties:
        minCopies:
          type: integer
        requiresReprintApproval:
          type: boolean
        requiresManagerApproval:
          type: boolean
        requiresSensitiveApproval:
          type: boolean
        status:
          type: string
    CreateTemplate:
      type: object
      required:
        - code
        - name
        - documentType
        - filePath
      properties:
        code:
          type: string
        name:
          type: string
        documentType:
          type: string
        templateVersion:
          type: integer
        filePath:
          type: string
        status:
          type: string
    UpdateTemplate:
      type: object
      properties:
        name:
          type: string
        documentType:
          type: string
        templateVersion:
          type: integer
        filePath:
          type: string
        status:
          type: string
